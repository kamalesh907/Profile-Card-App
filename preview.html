<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flutter Profile Card Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Roboto', sans-serif;
      padding: 24px;
    }
    /* Phone Shell */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background: #f4f6fb;
      border-radius: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 12px #2d303e, 0 0 0 14px #1b1d26;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* Status bar */
    .status-bar {
      height: 44px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a2e;
      background: #f4f6fb;
      z-index: 10;
    }
    .status-bar .notch {
      width: 120px;
      height: 24px;
      background: #1b1d26;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: calc(50% - 60px);
    }
    /* AppBar */
    .app-bar {
      height: 56px;
      background: #f4f6fb;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: relative;
    }
    .app-bar-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2238;
      letter-spacing: 0.2px;
    }
    /* Body */
    .app-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: #f4f6fb;
    }
    /* Profile Card */
    .profile-card {
      width: 100%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(63, 81, 181, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Avatar */
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3f51b5, #5c6bc0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.5px;
      box-shadow: 0 6px 16px rgba(63, 81, 181, 0.3);
      margin-bottom: 16px;
    }
    .name {
      font-size: 22px;
      font-weight: 700;
      color: #1a1c29;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }
    .role {
      font-size: 14px;
      font-weight: 600;
      color: #3f51b5;
      margin-bottom: 20px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: #edf0f7;
      margin-bottom: 18px;
    }
    .contact-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .contact-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .contact-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #eef0fa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3f51b5;
      flex-shrink: 0;
    }
    .contact-icon-box .material-icons-outlined {
      font-size: 20px;
    }
    .contact-text {
      font-size: 14px;
      font-weight: 500;
      color: #2b2e3e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Home indicator */
    .home-indicator {
      width: 130px;
      height: 4px;
      background: #1b1d26;
      border-radius: 2px;
      margin: 12px auto;
    }
  </style>
</head>
<body>
  <div class="phone-mockup">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span>●●● 5G 100%</span>
    </div>
    <div class="app-bar">
      <h1 class="app-bar-title">My Profile</h1>
    </div>
    <div class="app-body">
      <div class="profile-card">
        <div class="avatar">KW</div>
        <div class="name">Kamaleshwaran</div>
        <div class="role">Flutter Developer Intern</div>
        <div class="divider"></div>
        <div class="contact-list">
          <div class="contact-row">
            <div class="contact-icon-box">
              <span class="material-icons-outlined">email</span>
            </div>
            <span class="contact-text">kamalesh.dev@example.com</span>
          </div>
          <div class="contact-row">
            <div class="contact-icon-box">
              <span class="material-icons-outlined">phone</span>
            </div>
            <span class="contact-text">+91 98765 43210</span>
          </div>
          <div class="contact-row">
            <div class="contact-icon-box">
              <span class="material-icons-outlined">location_on</span>
            </div>
            <span class="contact-text">Chennai, India</span>
          </div>
        </div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
